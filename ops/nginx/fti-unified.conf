# FTI landing + member workspace. The backend remains private on port 3081.
server {
 listen 3080;
 server_name _;
 client_max_body_size 1m;
 location / {
  proxy_pass http://127.0.0.1:3081;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 90s;
 }
}
server {
 listen 3090;
 server_name _;
 root /opt/fti-protocol/landing/dist;
 index index.html;
 client_max_body_size 1m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy no-referrer always;
 location = /app { return 301 /app/; }
 location /app/ {
  # Strip the prefix for the existing frontend; relative assets stay under /app/.
  proxy_pass http://127.0.0.1:3081/;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 90s;
 }
 location ~ ^/(api/|abi/|vendor/|rpc$|health$) {
  proxy_pass http://127.0.0.1:3081;
  proxy_http_version 1.1;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 90s;
 }
 location / { try_files $uri $uri/ =404; }
 location ~ /\. { deny all; }
}
