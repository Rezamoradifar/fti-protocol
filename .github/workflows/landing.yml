name: Landing release checks
on:
  push:
    paths: ['landing/**', '.github/workflows/landing.yml']
  pull_request:
    paths: ['landing/**', '.github/workflows/landing.yml']
jobs:
  landing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - run: npm ci
      - run: npm ci --prefix landing
      - run: npm run build:web
      - run: npm run build --prefix landing
      - run: bash -n landing/install-dist.sh
      - run: sudo env PATH="$PATH" npm run test:install --prefix landing
      - run: cd landing && npx playwright install --with-deps chromium
      - run: npm test --prefix landing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landing-browser-results
          path: landing/test-results
      - uses: actions/upload-artifact@v4
        with:
          name: landing-prebuilt
          path: landing/dist
