name: Global frontend installer
on:
  pull_request:
    paths:
      - 'tools/install-global-frontend.py'
      - 'test/global-frontend-installer.test.py'
      - '.github/workflows/global-frontend-install.yml'
permissions:
  contents: read
jobs:
  static-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix landing
      - run: npm run build:web
      - run: npm --prefix landing run build
      - run: node --test test/global-frontend.test.mjs test/member-landing-theme.test.mjs
      - name: Build the legacy installer's exact pinned fixture
        shell: bash
        run: |
          revision=$(python3 -c 'import runpy; print(runpy.run_path("tools/install-global-frontend.py")["REV"])')
          fixture="$RUNNER_TEMP/fti-global-ui-fixture"
          mkdir -p "$fixture"
          git archive "$revision" | tar -x -C "$fixture"
          npm ci --prefix "$fixture"
          (cd "$fixture" && npm run build:web && npm --prefix landing run build)
          echo "FTI_GLOBAL_UI_FIXTURE_ROOT=$fixture" >> "$GITHUB_ENV"
      - run: python3 -I test/global-frontend-installer.test.py
