name: Mainnet preparation and runtime rehearsal
on:
  pull_request:
    paths:
      - 'core/**'
      - 'scripts/**'
      - 'frontend/**'
      - 'landing/src/**'
      - 'test/mainnet-*.test.mjs'
      - 'test/v3-wallets.test.mjs'
      - 'contracts/**'
      - 'config/v3-wallets.json'
      - 'tools/prepare-mainnet-candidate.sh'
      - 'tools/mainnet-metamask/**'
      - 'config/mainnet*'
      - '.github/workflows/mainnet-preparation.yml'
permissions:
  contents: read
jobs:
  mainnet-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm --prefix landing ci
      - run: npm run compile
      - run: npm run build:web
      - run: npm --prefix landing run build
      - run: bash -n tools/prepare-mainnet-candidate.sh
      - run: sudo python3 -m unittest discover -s tools/mainnet-metamask -p test_install.py -v
      - run: cd landing && npx playwright install --with-deps chromium
      - run: node tools/mainnet-metamask/test_browser.mjs
      - run: node --test --test-concurrency=2 test/mainnet-*.test.mjs test/v3-wallets.test.mjs test/wallet-discovery.test.mjs test/continuity-monitor.test.mjs test/funded-keeper.test.mjs test/fresh-testnet.test.mjs test/global-frontend.test.mjs test/site-routing.test.mjs test/v3-server.test.mjs test/event-server.test.mjs
