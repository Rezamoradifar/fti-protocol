name: Dependency security evidence
on: [push, pull_request]
permissions:
  contents: read
jobs:
  installed-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit physical packages including Ganache bundles
        run: node scripts/audit-installed.mjs audit/dependencies/ci-installed
      - uses: actions/upload-artifact@v4
        with:
          name: installed-dependency-advisories
          path: audit/dependencies/ci-installed.json
  production-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --omit=dev --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - name: Verify runtime imports and dev-tool exclusion
        run: |
          node --input-type=module -e "await import('ethers'); await import('react'); await import('react-dom');"
          test ! -d node_modules/ganache
          test ! -d node_modules/solc
      - name: Check independent landing dependencies
        working-directory: landing
        run: npm audit --omit=dev --audit-level=high
