name: Member landing theme
on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'web/index.html'
      - 'web/style.css'
      - 'landing/src/initial-landing.css'
      - 'scripts/build-web.mjs'
      - 'test/member-landing-theme.test.mjs'
      - 'test/continuity-deployment.test.mjs'
      - '.github/workflows/member-theme.yml'
permissions:
  contents: read
jobs:
  member-theme:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm --prefix landing run build
      - run: npm run compile
      - run: node --test test/member-landing-theme.test.mjs test/continuity-deployment.test.mjs
