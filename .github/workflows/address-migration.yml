name: Funded new-address migration
on:
  pull_request:
    paths:
      - 'contracts/FTIAddressMigration.sol'
      - 'scripts/*address-migration*.mjs'
      - 'test/address-migration.test.mjs'
      - '.github/workflows/address-migration.yml'
permissions:
  contents: read
jobs:
  funded-migration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node --test test/address-migration.test.mjs
      - run: npm run build:web
