name: FTI unlimited referral placement candidate

on:
  push:
    branches:
      - feat/fti-unlimited-referrals-auto-placement-20261013
  pull_request:
    branches:
      - feat/fresh-testnet-release-20261012

jobs:
  verify-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node --test --test-concurrency=1 test/referral-placement.test.mjs test/referral-placement-contract.test.mjs test/referral-layout.test.mjs
      - name: Report scope
        run: echo "LOCAL EVM TESTS ONLY — No public network transaction, no contract upgrade."
