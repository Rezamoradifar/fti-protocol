name: FTI V3 candidate checks

on:
  push:
    branches:
      - feat/zero-start-charity-protection
  pull_request:
    branches:
      - fix/funded-binary

jobs:
  v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run build:web
      - run: node --test --test-concurrency=1 test/v3-*.test.mjs
      - run: node scripts/v3-http-smoke.mjs
      - run: node scripts/build-launcher-v3.mjs
      - name: Validate V3 launcher content
        run: |
          test -s launcher/artifacts/FTIReserveTokenV3.json
          test -s launcher/artifacts/FundedBinaryPlan.json
          test -s launcher/artifacts/SevenGuardianCouncil.json
          grep -q "5-of-7 Partner DAO" launcher/index.html
          grep -q "FTIReserveTokenV3" launcher/app.js
