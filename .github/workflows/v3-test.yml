name: FTI V3 candidate checks

on:
  push:
    branches:
      - feat/zero-start-charity-protection
  pull_request:
    branches:
      - fix/funded-binary

jobs:
  v3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node --test --test-concurrency=1 test/v3-candidate.test.mjs
