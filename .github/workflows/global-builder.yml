name: Global Builder controls
on:
  pull_request:
    branches: ['feat/funded-address-migration-20261011']
permissions:
  contents: read
jobs:
  builder-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: node scripts/check-upgrade-layout.mjs docs/storage-layout/FundedBinaryPlanUpgradeable-20261009.json artifacts/storage-layout/FundedBinaryPlanUpgradeable.json
      # Deployment checks read generated web assets through releaseManifest.
      - run: npm run build:web
      - run: node --test --test-concurrency=2 test/global-builder-controls.test.mjs test/funded-keeper.test.mjs test/continuity-deployment.test.mjs test/continuity-upgrade.test.mjs test/address-migration*.test.mjs test/builder-installer.test.mjs
