name: FTI Telegram channel
on:
  workflow_dispatch:
    inputs:
      publish_slots:
        description: "Optional early release in Tehran time (YYYY-MM-DD 09,13). Leave empty to verify only."
        type: string
        required: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/fti-telegram-channel.yml'
      - 'marketing/telegram/**'
  schedule:
    # 09:00, 13:00, 17:00 and 21:00 in Tehran.
    - cron: '30 5 * * *'
    - cron: '30 9 * * *'
    - cron: '30 13 * * *'
    - cron: '30 17 * * *'
permissions:
  actions: read
  contents: write
concurrency:
  group: fti-official-telegram-publisher-${{ github.event.schedule || github.event_name }}
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install image and HTTP libraries
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends python3-pil python3-requests fonts-dejavu-core
      - name: Test publisher timing and editorial media
        run: /usr/bin/python3 -m unittest discover -s marketing/telegram -p 'test_*.py'
      - name: Preview a live photo and GIF
        if: github.event_name != 'schedule'
        run: |
          /usr/bin/python3 marketing/telegram/publish-mainnet-card.py --preview 9 "$RUNNER_TEMP/fti-preview.jpg"
          /usr/bin/python3 marketing/telegram/publish-mainnet-card.py --preview 13 "$RUNNER_TEMP/fti-preview.gif"
      - name: Verify bot and channel access
        if: ${{ !cancelled() && github.event_name != 'schedule' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo '::error::Missing TELEGRAM_BOT_TOKEN Actions secret'
            exit 1
          fi
          /usr/bin/python3 -c "import runpy; runpy.run_path('marketing/telegram/publish-mainnet-card.py')['verify_bot']()"
      - name: Publish the scheduled card
        if: github.event_name == 'schedule'
        env:
          SCHEDULE: ${{ github.event.schedule }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: /usr/bin/python3 marketing/telegram/publish-mainnet-card.py
      - name: Publish explicitly requested slots
        if: >-
          success() && github.ref == 'refs/heads/main' &&
          ((github.event_name == 'workflow_dispatch' && inputs.publish_slots != '') ||
          (github.event_name == 'push' && contains(github.event.head_commit.message, 'FTI-Publish:')))
        env:
          MANUAL_SLOTS: ${{ inputs.publish_slots }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          request="$MANUAL_SLOTS"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            request="$(git log -1 --format='%(trailers:key=FTI-Publish,valueonly)')"
          fi
          /usr/bin/python3 marketing/telegram/publish-mainnet-card.py --publish-request "$request"
