name: Member theme installer
on:
  pull_request:
    paths:
      - 'tools/install-member-theme.py'
      - 'test/member-theme-installer.test.py'
      - 'frontend/member-landing-theme.css'
      - '.github/workflows/member-theme-installer.yml'
permissions:
  contents: read
jobs:
  static-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -I test/member-theme-installer.test.py
      - name: Check the real reviewed CSS matches the installer's pin
        run: |
          python3 -I - <<'PY'
          import pathlib, runpy
          m = runpy.run_path('tools/install-member-theme.py')
          css = pathlib.Path('frontend/member-landing-theme.css').read_bytes()
          assert m['blob'](css) == m['THEME_BLOB'], 'Unexpected theme bytes'
          assert b'body[data-surface="member"]' in css
          assert b'@import' not in css and b'url(' not in css
          print('REVIEWED_THEME_PIN_PASS')
          PY
