name: Global frontend
on:
  pull_request:
    branches: ['feat/read-only-user-backup-20261011']
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - run: npm --prefix landing run build
      - run: node --test test/global-frontend.test.mjs test/member-landing-theme.test.mjs
      - run: npm run compile
      - run: node --test test/continuity-deployment.test.mjs
      - name: Preserve reviewed source and frontend output (no deployment or credentials)
        run: |
          mkdir -p /tmp/fti-global-review
          git archive --format=tar HEAD | gzip > /tmp/fti-global-review/source.tar.gz
          git rev-parse HEAD > /tmp/fti-global-review/BUILD_COMMIT
          cp -a web landing/dist /tmp/fti-global-review/
      - uses: actions/upload-artifact@v4
        with:
          name: global-frontend-review
          path: /tmp/fti-global-review
          retention-days: 3
