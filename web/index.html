<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0b1512">
  <meta name="description" content="FTI Protocol member workspace, token market and account tools.">
  <title>FTI Protocol</title>
  <link rel="icon" href="./favicon.svg">
  <link rel="modulepreload" href="./app.js">
  <link rel="modulepreload" href="./vendor/ethers.js">
  <!-- FTI_WORKSPACE_STYLE_START -->
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="./member-landing-theme.css">
  <link rel="stylesheet" href="./global-interface.css">
  <link rel="stylesheet" href="./panel-identity.css">
  <link rel="stylesheet" href="./member-reserve-panel.css">
  <link rel="stylesheet" href="./app.css">
  <!-- FTI_WORKSPACE_STYLE_END -->
  <link rel="stylesheet" href="./customer-widget.css" data-fti-customer-style>
  <style data-fti-boot-style>
    html:has([data-fti-boot]),body:has([data-fti-boot]) {margin:0;background:#0b1512}
    [data-fti-boot] {box-sizing:border-box;min-height:100vh;min-height:100svh;position:relative;isolation:isolate;background:#0b1512;color:#f4f7ed;font:16px/1.65 Tahoma,Arial,sans-serif;text-align:start}
    [data-fti-boot] * {box-sizing:border-box}
    .fti-start-frame {max-width:66rem;margin:auto;padding:0 clamp(18px,5vw,56px)}
    .fti-start-bar {min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px;border-bottom:1px solid #354139}
    .fti-start-brand {display:inline-flex;align-items:center;gap:9px;color:#eff4e7;font:700 18px/1.2 Arial,sans-serif;letter-spacing:.05em}
    .fti-start-brand i {display:inline-block;width:12px;height:18px;border:3px solid #b8eb99;border-top-width:7px;transform:skew(-12deg)}
    [data-fti-boot] a {color:#c9edae;text-decoration:underline;text-underline-offset:.24em}
    .fti-start-body {padding-block:clamp(26px,6vw,64px)}
    .fti-start-body h1 {margin:0;color:inherit;font:700 clamp(27px,5vw,46px)/1.4 Tahoma,Arial,sans-serif}
    .fti-start-body p {margin:.45rem 0 1.2rem;color:#c1cec5}
    .fti-start-nav {display:flex;gap:10px;flex-wrap:wrap}
    .fti-start-nav a,[data-fti-boot-retry] {display:inline-flex;align-items:center;min-height:44px;padding:8px 17px;border:1px solid #536753;border-radius:10px;background:#15231a;color:#e8f6de;font:inherit;text-decoration:none;cursor:pointer}
    [data-fti-boot] :focus-visible {outline:2px solid #c4f39f;outline-offset:3px}
    [data-fti-recovery] {margin-top:24px}
    [data-fti-recovery][hidden],[data-fti-guarded] [data-fti-native-retry] {display:none!important}
    [data-fti-native-retry] {display:inline-block;visibility:hidden;margin-top:20px;animation:fti-native-help 0s 18s forwards}
    @keyframes fti-native-help {to {visibility:visible}}
  </style>
</head>
<body>
  <div id="root"><!-- FTI_BOOT_FALLBACK_BEGIN --><section data-fti-boot data-state="preview" lang="fa" dir="rtl" aria-labelledby="fti-start-title">
    <div class="fti-start-frame">
      <header class="fti-start-bar">
        <span class="fti-start-brand" dir="ltr"><i aria-hidden="true"></i>FTI Protocol</span>
        <a data-fti-preview-home href="/?lang=fa">صفحهٔ اصلی FTI</a>
      </header>
      <div class="fti-start-body">
        <h1 id="fti-start-title" data-fti-preview-title>پنل اعضا</h1>
        <p data-fti-preview-description>عضویت و شبکهٔ خود را ببینید.</p>
        <nav class="fti-start-nav">
          <a data-fti-preview-member href="/app/?lang=fa">پنل اعضا</a>
          <a data-fti-preview-market href="/token/?lang=fa#trade">بازار توکن</a>
        </nav>
        <div data-fti-recovery hidden role="status"><p data-fti-boot-message></p><button type="button" data-fti-boot-retry>تلاش دوباره</button></div>
        <a data-fti-native-retry href="" target="_blank" rel="noopener">باز کردن دوبارهٔ صفحه</a>
      </div>
    </div>
  </section><!-- FTI_BOOT_FALLBACK_END --></div><noscript><p lang="fa" dir="rtl">برای استفاده از امکانات کیف‌پول، جاوااسکریپت مرورگر را فعال کنید.</p><p lang="en" dir="ltr">Enable JavaScript to use the wallet tools.</p></noscript>
  <script defer src="./boot-guard.js" data-fti-boot-guard></script>
  <script type="module" src="./app.js" data-fti-app-entry></script>
  <script type="module" src="./customer-widget.js" data-fti-customer-entry></script>
</body>
</html>
